<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TMG301 Text Mining Master Exam Prep - Website ôn thi toàn diện 17 Chapter môn Khai phá văn bản (TMG301) tại FPT University. Ngân hàng 950 câu hỏi trắc nghiệm, đề thi thử 50 phút, và trích dẫn slide chi tiết.">
  <title>TMG301 Master • Khai Phá Văn Bản & Ôn Thi Toàn Diện (17 Chapters)</title>

  <!-- App Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Cpath d='M25 32h50M25 50h36M25 68h44' stroke='%23ffffff' stroke-width='8' stroke-linecap='round'/%3E%3Ccircle cx='75' cy='68' r='5' fill='%2310b981'/%3E%3C/svg%3E">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 (Icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- App Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="brand-section">
      <button class="btn-icon" id="btn-mobile-menu" aria-label="Toggle mobile menu" style="display: none;">
        <i class="fas fa-bars"></i>
      </button>
      <div class="brand-logo">
        <i class="fas fa-brain"></i>
      </div>
      <div class="brand-text">
        <h1>TMG301 Master <span class="brand-badge">Term 5</span></h1>
        <div class="brand-subtitle">Text Mining Exam Prep • 17 Chapters • 950 Questions</div>
      </div>
    </div>

    <!-- Center Navigation Tabs -->
    <nav class="nav-tabs" aria-label="Main Navigation">
      <button class="nav-tab-btn active" data-view="knowledge">
        <i class="fas fa-book-open"></i> <span>Lý thuyết</span>
      </button>
      <button class="nav-tab-btn" data-view="quiz">
        <i class="fas fa-pencil-alt"></i> <span>Luyện tập (50 câu)</span>
      </button>
      <button class="nav-tab-btn" data-view="exam">
        <i class="fas fa-stopwatch"></i> <span>Thi thử (50 phút)</span>
      </button>
      <button class="nav-tab-btn" data-view="bank">
        <i class="fas fa-database"></i> <span>Ngân hàng 950 câu</span>
      </button>
      <button class="nav-tab-btn" data-view="glossary">
        <i class="fas fa-book"></i> <span>Thuật ngữ</span>
      </button>
    </nav>

    <!-- Header Action Icons -->
    <div class="header-actions">
      <button class="btn-search-trigger" id="btn-search-trigger" title="Tìm kiếm nhanh (Ctrl + K)">
        <i class="fas fa-search"></i>
        <span>Tìm kiếm...</span>
        <kbd>Ctrl K</kbd>
      </button>

      <button class="btn-icon" id="btn-theme-toggle" aria-label="Chuyển chế độ sáng/tối" title="Chuyển đổi giao diện Sáng / Tối">
        <i class="fas fa-sun" id="theme-icon"></i>
      </button>
    </div>
  </header>

  <!-- App Main Layout -->
  <div class="app-layout">
    <!-- Sidebar: 17 Chapters Navigation -->
    <aside class="app-sidebar" id="app-sidebar" aria-label="Chapters Sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title"><i class="fas fa-list-ul"></i> Mục lục chuyên đề</span>
        <span class="chapter-count-badge">17 Chapters</span>
      </div>
      <ul class="sidebar-chapter-list" id="sidebar-chapters">
        <!-- Rendered dynamically by app.js -->
      </ul>
    </aside>

    <!-- Main Dynamic Content Container -->
    <main class="app-content" id="app-content-area" role="main">
      <!-- Injected dynamically by app.js -->
    </main>
  </div>

  <!-- Global Quick Search Modal (Ctrl + K) -->
  <div class="modal-overlay" id="global-search-modal" role="dialog" aria-modal="true" aria-labelledby="modal-search-title">
    <div class="modal-box">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
        <h3 id="modal-search-title" style="font-size: 1.15rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 0.5rem;">
          <i class="fas fa-search" style="color: var(--accent-primary);"></i> Tra cứu nhanh TMG301
        </h3>
        <kbd style="font-size: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); padding: 0.15rem 0.45rem; border-radius: var(--radius-sm); font-family: var(--font-mono); color: var(--text-muted);">ESC để đóng</kbd>
      </div>

      <input type="text" class="search-input-field" id="global-search-input" placeholder="Tìm theo tên chương, chủ đề, câu hỏi, hoặc thuật ngữ tiếng Anh...">

      <div style="margin-top: 1.25rem; max-height: 450px; overflow-y: auto;" id="global-search-results">
        <!-- Search results rendered here -->
      </div>
    </div>
  </div>

  <!-- Application Data Bundles (Zero-CORS offline local compatibility) -->
  <script src="data/chapters.js"></script>
  <script src="data/knowledge.js"></script>
  <script src="data/questions.js"></script>
  <script src="data/glossary.js"></script>

  <!-- Core App Controller -->
  <script src="js/app.js"></script>
</body>
</html>
